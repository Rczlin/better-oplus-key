name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Test release metadata
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test daemon
        run: bash scripts/test-host.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test companion app logic
        run: bash scripts/test-companion.sh
      - name: Test and build WebUI
        working-directory: webui
        run: |
          npm ci
          npm test -- --testTimeout=15000
          npm run lint
          npm run build
      - name: Install Android NDK and SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build ARM64 daemon
        run: |
          export NDK="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-daemon.sh
      - name: Build fluid cloud companion app
        run: bash scripts/build-companion.sh
      - name: Package module
        run: sh scripts/package-module.sh
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/prepare-release.py --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: oplus-sidekey-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: oplus-sidekey-${{ github.sha }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OnePlus Side Key $GITHUB_REF_NAME" \
            --notes-file dist/changelog.md --latest
